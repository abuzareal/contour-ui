name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Determine affected checks
        id: scope
        env:
          CONTOUR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-scope.mjs
      - run: npm ci --ignore-scripts
      - name: Types, lint, build and archive contents
        run: npm run check:styles && npm run typecheck && npm run lint && npm run build && npm run check:package && npm run check:api-docs && npm run check:docs && npm run check:reference && npm run check:onboarding
      - if: steps.scope.outputs.runtime == 'true'
        run: npm test
      - if: steps.scope.outputs.runtime == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.runtime == 'true'
        run: npm run test:browser
      - name: Pack the candidate once
        if: steps.scope.outputs.runtime == 'true'
        run: |
          node --input-type=module <<'NODE'
          import {packedArchive} from "./scripts/packed-archive.mjs";
          import {appendFileSync} from "node:fs";
          const archive = await packedArchive(process.env.RUNNER_TEMP);
          appendFileSync(process.env.GITHUB_ENV, `CONTOUR_ARCHIVE=${archive}\n`);
          NODE
      - if: steps.scope.outputs.runtime == 'true'
        run: npm run test:compat
      - if: steps.scope.outputs.runtime == 'true' && steps.scope.outputs.next == 'true'
        run: node scripts/test-next.mjs
      - name: Public standalone starters
        if: steps.scope.outputs.runtime == 'true' && steps.scope.outputs.next == 'true'
        run: node scripts/test-starters.mjs
      - name: Production size budgets
        if: steps.scope.outputs.runtime == 'true' && steps.scope.outputs.next == 'true'
        env:
          CONTOUR_SIZE_OUTPUT: ${{ runner.temp }}/contour-sizes.json
        run: npm run check:size
      - run: npm audit --audit-level=low

      - name: Strict accessibility and visual QA
        if: steps.scope.outputs.runtime == 'true'
        run: npm run test:qa
      - name: Retain failed QA evidence
        if: failure() && steps.scope.outputs.runtime == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contour-qa-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
