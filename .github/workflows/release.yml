name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing package version and vVERSION tag to release"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'abuzareal/contour-ui' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate version input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e 'if (!/^\d+\.\d+\.\d+$/.test(process.env.RELEASE_VERSION)) process.exit(1)'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("package.json")); assert.match(process.env.RELEASE_VERSION, /^\d+\.\d+\.\d+$/); assert.equal(p.version,process.env.RELEASE_VERSION); assert.equal(p.name,"@abuzareal/contour-ui"); assert.equal(p.private,false);'
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify one release archive
        env:
          CONTOUR_RELEASE_DIR: ${{ runner.temp }}
        run: node scripts/verify-release.mjs
      - name: Publish the verified archive with trusted identity and provenance
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          import {createHash} from "node:crypto";
          import {execFileSync} from "node:child_process";
          import assert from "node:assert/strict";
          const verified = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/verified-archive.json`));
          assert.equal(createHash("sha256").update(readFileSync(verified.archive)).digest("hex"), verified.checksum);
          execFileSync("npm", ["publish", verified.archive, "--ignore-scripts", "--access", "public", "--provenance"], {stdio: "inherit"});
          NODE
